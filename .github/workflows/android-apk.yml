name: Granny HD Android prototype

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build source-only test APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Unity Personal activation secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          for secret_name in UNITY_LICENSE UNITY_EMAIL UNITY_PASSWORD; do
            if [ -z "${!secret_name}" ]; then
              echo "::error title=Missing Unity activation secret::$secret_name is not configured in Settings > Secrets and variables > Actions."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::notice::See https://game.ci/docs/github/activation/ for legally activating Unity Personal."
            exit 1
          fi
          echo "All three Unity Personal activation settings are present. Starting actual engine build."

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: unity-2021-android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            unity-2021-android-

      - name: Build APK with Unity GameCI
        uses: game-ci/unity-builder@v6
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 2021.3.11f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: CloudBuildAndroid.Build

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GrannyHD-Android-Prototype
          path: build/Android/*.apk
          if-no-files-found: error
