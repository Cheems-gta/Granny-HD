name: Godot V0.6 Android APK

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.release.tag_name == 'v0.6-source'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - uses: actions/checkout@v4
      - name: Obtain full project archive
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/Cheems-gta/Granny-HD/releases/download/v0.6-source/Granny_HD_Godot_V0_6_Connected_House_Prototype.zip"
          curl --fail --location --retry 3 --max-time 900 -o /tmp/project.zip "$url"
          echo "db31e5e52e9931e8265bb9f56e4cd76b044ff7fe34f13a4bd73a4eed162c919f  /tmp/project.zip" | sha256sum -c -
          mkdir -p stage build
          unzip -q /tmp/project.zip -d stage
          test -s stage/godot/project.godot
          test -s stage/godot/scripts/room_wing.gd
          n=$(find stage/godot/textures -type f -name '*.png' | wc -l)
          test "$n" -eq 295
      - name: Configure Android tools
        shell: bash
        run: |
          set -euo pipefail
          version=4.4.1.stable
          src="/root/.local/share/godot/export_templates/$version"
          dst="$HOME/.local/share/godot/export_templates/$version"
          mkdir -p "$dst" "$HOME/.config/godot"
          cp -a "$src/." "$dst/"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<'EOF'
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          sdkmanager --sdk_root="/usr/lib/android-sdk" "platform-tools" "build-tools;34.0.0" "platforms;android-34"
      - name: Import full Godot project
        run: godot --headless --path stage/godot --editor --import
      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /root/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path stage/godot --export-debug Android "$GITHUB_WORKSPACE/build/GrannyHD_V06_Debug.apk" 2>&1 | tee build/export.log
          test -s build/GrannyHD_V06_Debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GrannyHD-V06-Android-Debug
          path: build/GrannyHD_V06_Debug.apk
          if-no-files-found: error
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GrannyHD-V06-Build-Logs
          path: build/*.log
          if-no-files-found: ignore
